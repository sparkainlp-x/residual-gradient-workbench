name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit tests (node --test, no npm dependencies)
        run: node --test test/*.test.mjs
      - name: Sample report regenerates byte-identically
        run: |
          node scripts/generate-sample-report.mjs
          git diff --exit-code -- reports/sample-report.json

  overclaim-scan:
    name: Overclaim scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scan for forbidden claims
        run: node scripts/overclaim-scan.mjs

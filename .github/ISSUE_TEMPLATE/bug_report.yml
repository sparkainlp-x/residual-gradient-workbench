name: Bug report
description: Report a reproducible defect in the residual replay, the thermoelectric model, the report or the page.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data or undisclosed vulnerabilities. Use SECURITY.md for security reports.
        This is a browser-only model with SYNTHETIC parameters; no hardware experiment has been performed.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Inputs (vectors, cap, tolerance, temperatures, S, R_int, R_load, duration), the action taken, and expected versus actual output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and version, or Node version for tests
    validations:
      required: true

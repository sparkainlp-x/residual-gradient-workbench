name: Physics or wording correction
description: Report an overclaim, a wrong equation, a misquoted upstream contract, or a model output presented as a measurement.
title: "evidence: "
labels: [documentation]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: File and line, page section, or report field.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong and what the source says
      description: Quote the textbook relation, upstream commit or reference that shows the correct statement.
    validations:
      required: true
